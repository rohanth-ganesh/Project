<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- FontAwesome for Social Media Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <!-- Video Background -->
    <div class="video-bg">
        <video id="background-video" autoplay loop muted>
            <source src="bg.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="header-text">
                <h1>GRA Consultancy Services</h1>
            </div>
        </div>
    </div>

    <!-- Login Form -->
    <div class="content-box">
        <div class="container">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button onclick="login()" class="btn">Login</button>
            <p>Don't have an account? <a href="#" class="button-link" onclick="showSignUp()">Sign up</a></p>

            <div id="signup" style="display:none;">
                <h2>Sign Up</h2>
                <input type="text" id="new-username" placeholder="New Username" required>
                <input type="password" id="new-password" placeholder="New Password" required>
                <button onclick="signUp()" class="btn">Sign Up</button>
                <p>Already have an account? <a href="#" class="button-link" onclick="showLogin()">Login</a></p>
            </div>

            <!-- Social Media Login -->
            <div class="social-login">
                <p>Or login with:</p>
                <div class="social-icons">
                    <i class="fab fa-google" onclick="loginWithGoogle()"></i>
                    <i class="fab fa-facebook-f" onclick="loginWithFacebook()"></i>
                    <i class="fab fa-twitter" onclick="loginWithTwitter()"></i>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
